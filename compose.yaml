name: portfolio-reconciliation
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: recon
      POSTGRES_PASSWORD: local-demo-only
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["recon-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recon -d reconciliation"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build: backend
    ports: ["127.0.0.1:8101:8101"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/reconciliation
      DATABASE_USER: recon
      DATABASE_PASSWORD: local-demo-only
    depends_on:
      db: { condition: service_healthy }
volumes:
  recon-data:
